name: Tracker
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Run tracker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python server.py &
          sleep 3
          ./cloudflared tunnel --url http://localhost:8080 > /tmp/cf.log 2>&1 &
          sleep 10
          LINK=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -1)
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"🔗 **Tracker is live!**\n\`\`\`${LINK}\`\`\`\"}"

          # watch log file and send new hits to discord
          touch /tmp/hits.log
          tail -f /tmp/hits.log | while read line; do
            if [ "$line" = "---" ]; then
              MSG=$(cat /tmp/current_hit.txt 2>/dev/null)
              if [ -n "$MSG" ]; then
                curl -s -X POST "$DISCORD_WEBHOOK" \
                  -H "Content-Type: application/json" \
                  -d "{\"content\": \"🎯 **New Hit!**\n\`\`\`${MSG}\`\`\`\"}"
                rm -f /tmp/current_hit.txt
              fi
            else
              echo "$line" >> /tmp/current_hit.txt
            fi
          done
