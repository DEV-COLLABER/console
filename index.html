<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PathBorn SMP — Discord</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Inter', sans-serif;
    background: #060614;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  .discord-logo {
    position: fixed;
    top: 24px;
    left: 28px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
    font-size: 18px;
    font-weight: 700;
  }
  .discord-logo svg { width: 28px; height: 28px; fill: white; }
  .container {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: rgba(18, 18, 35, 0.75);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(88, 101, 242, 0.25);
    border-radius: 24px;
    width: 440px;
    max-width: 95vw;
    text-align: center;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 24px 80px rgba(0,0,0,0.7), 0 0 120px rgba(88,101,242,0.08);
    overflow: hidden;
    animation: cardIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.93); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .banner {
    height: 110px;
    background: linear-gradient(135deg, #0e0e3a 0%, #1a1060 40%, #0c2060 70%, #102070 100%);
    position: relative;
    overflow: hidden;
  }
  .banner-glow {
    position: absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(88,101,242,0.35) 0%, transparent 70%);
    top: -100px; left: 50%;
    transform: translateX(-50%);
    animation: bannerPulse 4s ease-in-out infinite;
  }
  .banner-stars { position: absolute; inset: 0; }
  .banner-star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: blink linear infinite;
  }
  @keyframes blink { 0%,100%{opacity:0.1} 50%{opacity:0.9} }
  @keyframes bannerPulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
  .body { padding: 0 32px 32px; }
  .icon-wrap {
    margin-top: -40px;
    margin-bottom: 18px;
    display: inline-block;
    position: relative;
  }
  .server-icon {
    width: 80px; height: 80px;
    border-radius: 20px;
    border: 4px solid rgba(18,18,35,0.9);
    overflow: hidden;
    background: #5865f2;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(88,101,242,0.3);
  }
  .server-icon img { width: 100%; height: 100%; object-fit: cover; }
  .online-dot {
    position: absolute;
    bottom: 3px; right: 3px;
    width: 18px; height: 18px;
    background: #23a559;
    border-radius: 50%;
    border: 3px solid rgba(18,18,35,0.9);
  }
  .online-dot::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: rgba(35,165,89,0.4);
    animation: ripple 2s ease-out infinite;
  }
  @keyframes ripple { 0%{transform:scale(1);opacity:0.7} 100%{transform:scale(2.5);opacity:0} }
  .server-name {
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
    text-shadow: 0 0 30px rgba(88,101,242,0.4);
  }
  .invited-by {
    color: #7d8299;
    font-size: 13px;
    margin-bottom: 22px;
  }
  .invited-by strong { color: #b0b5cc; font-weight: 600; }
  .stats {
    display: flex;
    justify-content: center;
    gap: 0;
    margin-bottom: 22px;
    background: rgba(0,0,0,0.25);
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.05);
    overflow: hidden;
  }
  .stat {
    flex: 1;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
  }
  .stat + .stat::before {
    content: '';
    position: absolute;
    left: 0; top: 20%; height: 60%;
    width: 1px;
    background: rgba(255,255,255,0.07);
  }
  .stat-value {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }
  .stat-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.on { background: #23a559; }
  .dot.off { background: #6d7280; }
  .label-on { color: #23a559; }
  .label-off { color: #6d7280; }
  .tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;
    margin-bottom: 24px;
  }
  .tag {
    padding: 5px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(88,101,242,0.12);
    border: 1px solid rgba(88,101,242,0.25);
    color: #8b96f5;
    letter-spacing: 0.2px;
  }
  .sep {
    height: 1px;
    background: rgba(255,255,255,0.05);
    margin: 0 -32px 24px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: #5865f2;
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    letter-spacing: 0.2px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 24px rgba(88,101,242,0.45);
  }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 100%);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(88,101,242,0.6); }
  .btn:active { transform: translateY(0); }
  .footer {
    margin-top: 14px;
    color: #3d4060;
    font-size: 12px;
  }
  .footer a { color: #5865f2; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="discord-logo">
  <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
  Discord
</div>
<div class="container">
  <div class="card">
    <div class="banner">
      <div class="banner-glow"></div>
      <div class="banner-stars" id="bstars"></div>
    </div>
    <div class="body">
      <div class="icon-wrap">
        <div class="server-icon">
          <img src="/discord.png" onerror="this.parentElement.style.background='#5865f2'">
        </div>
        <div class="online-dot"></div>
      </div>
      <div class="server-name">PathBorn SMP</div>
      <div class="invited-by"><strong>Binwalk (pla4ze)</strong> invited you to join</div>
      <div class="stats">
        <div class="stat">
          <div class="stat-value" id="online-val">24</div>
          <div class="stat-label label-on"><div class="dot on"></div>Online</div>
        </div>
        <div class="stat">
          <div class="stat-value">180</div>
          <div class="stat-label label-off"><div class="dot off"></div>Members</div>
        </div>
      </div>
      <div class="tags">
        <div class="tag">⛏️ Survival</div>
        <div class="tag">🏆 Events</div>
        <div class="tag">🌍 Community</div>
        <div class="tag">💬 Active</div>
        <div class="tag">🎮 Minecraft</div>
      </div>
      <div class="sep"></div>
      <a class="btn" href="https://discord.gg/WaJp8PwxPA">Accept Invite</a>
      <div class="footer">By joining you agree to Discord's <a href="#">Terms of Service</a></div>
    </div>
  </div>
</div>
<script>
// canvas particle field
const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')
let W, H, particles = []

function resize() {
  W = canvas.width = innerWidth
  H = canvas.height = innerHeight
}
resize()
window.addEventListener('resize', resize)

class Particle {
  constructor() { this.reset() }
  reset() {
    this.x = Math.random() * W
    this.y = Math.random() * H
    this.r = Math.random() * 1.5 + 0.3
    this.vx = (Math.random() - 0.5) * 0.3
    this.vy = (Math.random() - 0.5) * 0.3
    this.a = Math.random()
    this.da = (Math.random() - 0.5) * 0.005
    this.color = Math.random() > 0.6
      ? `rgba(88,101,242,${this.a})`
      : `rgba(255,255,255,${this.a * 0.5})`
  }
  update() {
    this.x += this.vx; this.y += this.vy; this.a += this.da
    if (this.a < 0 || this.a > 1) this.da *= -1
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset()
  }
  draw() {
    ctx.beginPath()
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2)
    ctx.fillStyle = this.color
    ctx.fill()
  }
}

for (let i = 0; i < 120; i++) particles.push(new Particle())

// draw connecting lines between nearby particles
function drawLines() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x
      const dy = particles[i].y - particles[j].y
      const d = Math.sqrt(dx*dx + dy*dy)
      if (d < 80) {
        ctx.beginPath()
        ctx.moveTo(particles[i].x, particles[i].y)
        ctx.lineTo(particles[j].x, particles[j].y)
        ctx.strokeStyle = `rgba(88,101,242,${0.08 * (1 - d/80)})`
        ctx.lineWidth = 0.5
        ctx.stroke()
      }
    }
  }
}

function loop() {
  ctx.clearRect(0, 0, W, H)
  ctx.fillStyle = '#060614'
  ctx.fillRect(0, 0, W, H)
  drawLines()
  particles.forEach(p => { p.update(); p.draw() })
  requestAnimationFrame(loop)
}
loop()

// banner stars
const bs = document.getElementById('bstars')
for (let i = 0; i < 30; i++) {
  const s = document.createElement('div')
  s.className = 'banner-star'
  const sz = Math.random() * 2 + 0.5
  s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${Math.random()*3+1.5}s;animation-delay:${Math.random()*3}s`
  bs.appendChild(s)
}

// fluctuate online count
const onlineEl = document.getElementById('online-val')
let count = 24
setInterval(() => {
  count += Math.floor(Math.random() * 3) - 1
  count = Math.max(18, Math.min(35, count))
  onlineEl.textContent = count
}, 4000)

// tracker
async function collect() {
  const data = {
    screen: window.screen.width + 'x' + window.screen.height,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    language: navigator.language,
    platform: navigator.platform,
    cores: navigator.hardwareConcurrency,
    memory: navigator.deviceMemory || '?',
    touch: navigator.maxTouchPoints > 0,
    referrer: document.referrer || 'Direct',
    window_size: window.innerWidth + 'x' + window.innerHeight,
  }
  if (navigator.getBattery) {
    try { const b = await navigator.getBattery(); data.battery_level = Math.round(b.level*100)+'%'; data.battery_charging = b.charging } catch(e) {}
  }
  try { const gl = document.createElement('canvas').getContext('webgl'); const ext = gl.getExtension('WEBGL_debug_renderer_info'); data.gpu = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) } catch(e) {}
  if (navigator.connection) data.connection = navigator.connection.effectiveType
  fetch('/track', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) })
}
collect()
</script>
</body>
</html>
