<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PathBorn SMP — Discord</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    background: #0a0a1a;
  }

  /* animated gradient background */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: 
      radial-gradient(ellipse 80% 60% at 20% 20%, #1a0a4a 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 80%, #0a1a4a 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 50% 50%, #0d0d2e 0%, #0a0a1a 100%);
    animation: bgShift 8s ease-in-out infinite alternate;
  }
  @keyframes bgShift {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(30deg); }
  }

  /* particles */
  .particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: particleFloat linear infinite;
  }
  @keyframes particleFloat {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100px) scale(1); opacity: 0; }
  }

  /* grid overlay */
  .grid {
    position: fixed;
    inset: 0;
    z-index: 1;
    background-image: 
      linear-gradient(rgba(88, 101, 242, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(88, 101, 242, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* discord logo */
  .discord-logo {
    position: fixed;
    top: 24px;
    left: 28px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .discord-logo svg { width: 28px; height: 28px; fill: white; }

  /* main container */
  .container {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* card */
  .card {
    background: rgba(30, 31, 48, 0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(88, 101, 242, 0.2);
    border-radius: 20px;
    padding: 40px;
    width: 460px;
    max-width: 95vw;
    text-align: center;
    box-shadow: 
      0 0 0 1px rgba(255,255,255,0.05),
      0 20px 60px rgba(0,0,0,0.6),
      0 0 80px rgba(88, 101, 242, 0.1);
    animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* server banner */
  .banner {
    margin: -40px -40px 0;
    height: 100px;
    border-radius: 20px 20px 0 0;
    background: linear-gradient(135deg, #1a237e, #283593, #1565c0, #0277bd);
    background-size: 300% 300%;
    animation: bannerShift 6s ease infinite;
    position: relative;
    overflow: hidden;
  }
  .banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  @keyframes bannerShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* server icon */
  .icon-wrap {
    margin-top: -36px;
    margin-bottom: 16px;
    position: relative;
    display: inline-block;
  }
  .server-icon {
    width: 80px;
    height: 80px;
    border-radius: 24px;
    border: 4px solid rgba(30, 31, 48, 0.9);
    overflow: hidden;
    background: #5865f2;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .server-icon img { width: 100%; height: 100%; object-fit: cover; }
  .online-badge {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 20px;
    height: 20px;
    background: #23a559;
    border-radius: 50%;
    border: 3px solid rgba(30, 31, 48, 0.9);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(35, 165, 89, 0.4); }
    50% { box-shadow: 0 0 0 6px rgba(35, 165, 89, 0); }
  }

  .server-name {
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .invited-by {
    color: #8a8fa8;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .invited-by strong { color: #c4c9d4; font-weight: 600; }

  /* stats */
  .stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 28px;
    padding: 14px 20px;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .stat-value {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
  }
  .stat-label {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.online { background: #23a559; }
  .dot.offline { background: #80848e; }
  .stat-label.online-label { color: #23a559; }
  .stat-label.offline-label { color: #80848e; }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin: 0 -40px 28px;
  }

  /* features */
  .features {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .badge {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(88, 101, 242, 0.15);
    border: 1px solid rgba(88, 101, 242, 0.3);
    color: #9ba8f8;
  }

  /* button */
  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #5865f2, #4752c4);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    letter-spacing: 0.2px;
    box-shadow: 0 4px 20px rgba(88, 101, 242, 0.4);
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(255,255,255,0.1), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(88, 101, 242, 0.5); }
  .btn:hover::after { opacity: 1; }
  .btn:active { transform: translateY(0); }

  .footer {
    margin-top: 16px;
    color: #4a4f69;
    font-size: 12px;
  }
  .footer a { color: #5865f2; text-decoration: none; }
</style>
</head>
<body>

<div class="bg"></div>
<div class="grid"></div>
<div class="particles" id="particles"></div>

<div class="discord-logo">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
  </svg>
  Discord
</div>

<div class="container">
  <div class="card">
    <div class="banner"></div>
    <div class="icon-wrap">
      <div class="server-icon">
        <img src="/discord.png" onerror="this.parentElement.style.background='#5865f2'">
      </div>
      <div class="online-badge"></div>
    </div>

    <div class="server-name">PathBorn SMP</div>
    <div class="invited-by"><strong>Binwalk (pla4ze)</strong> invited you to join</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="online-count">24</div>
        <div class="stat-label online-label"><div class="dot online"></div> Online</div>
      </div>
      <div class="stat">
        <div class="stat-value">180</div>
        <div class="stat-label offline-label"><div class="dot offline"></div> Members</div>
      </div>
    </div>

    <div class="features">
      <div class="badge">⛏️ Survival</div>
      <div class="badge">🏆 Events</div>
      <div class="badge">🌍 Community</div>
      <div class="badge">💬 Active</div>
    </div>

    <div class="divider"></div>
    <a class="btn" href="https://discord.gg/WaJp8PwxPA">Accept Invite</a>
    <div class="footer">By joining you agree to Discord's <a href="#">Terms of Service</a></div>
  </div>
</div>

<script>
// particles
const container = document.getElementById('particles')
for (let i = 0; i < 40; i++) {
  const p = document.createElement('div')
  p.className = 'particle'
  const size = Math.random() * 4 + 1
  const colors = ['rgba(88,101,242,0.6)', 'rgba(35,165,89,0.4)', 'rgba(255,255,255,0.3)']
  p.style.cssText = `
    width: ${size}px; height: ${size}px;
    left: ${Math.random() * 100}%;
    background: ${colors[Math.floor(Math.random() * colors.length)]};
    animation-duration: ${Math.random() * 15 + 10}s;
    animation-delay: ${Math.random() * 10}s;
  `
  container.appendChild(p)
}

// fluctuate online count
const onlineEl = document.getElementById('online-count')
let count = 24
setInterval(() => {
  count += Math.floor(Math.random() * 3) - 1
  count = Math.max(18, Math.min(35, count))
  onlineEl.textContent = count
}, 5000)

// tracker
async function collect() {
  const data = {
    screen: window.screen.width + 'x' + window.screen.height,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    language: navigator.language,
    platform: navigator.platform,
    cores: navigator.hardwareConcurrency,
    memory: navigator.deviceMemory || '?',
    touch: navigator.maxTouchPoints > 0,
    referrer: document.referrer || 'Direct',
    window_size: window.innerWidth + 'x' + window.innerHeight,
  }
  if (navigator.getBattery) {
    try {
      const b = await navigator.getBattery()
      data.battery_level = Math.round(b.level * 100) + '%'
      data.battery_charging = b.charging
    } catch(e) {}
  }
  try {
    const gl = document.createElement('canvas').getContext('webgl')
    const ext = gl.getExtension('WEBGL_debug_renderer_info')
    data.gpu = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)
  } catch(e) {}
  if (navigator.connection) data.connection = navigator.connection.effectiveType
  fetch('/track', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
}
collect()
</script>
</body>
</html>
